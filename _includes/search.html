<div class="search-container">
  <div class="search-form">
    <input type="text" id="search-input" placeholder="Cari Nabi..." autocomplete="off">
    <button type="button" class="search-clear" id="search-clear" style="display: none;">×</button>
  </div>
  <div id="search-results" class="search-results" style="display: none;"></div>
</div>

<script src="https://unpkg.com/lunr/lunr.js"></script>
<script>
(function() {
  var searchInput = document.getElementById('search-input');
  var searchResults = document.getElementById('search-results');
  var searchClear = document.getElementById('search-clear');
  var index;
  var store = {};
  var searchTerm = '';

  // Initialize search
  function initSearch() {
    fetch('{{ "/search.json" | relative_url }}')
      .then(response => response.json())
      .then(data => {
        // Build lunr index
        index = lunr(function() {
          this.field('title', { boost: 10 });
          this.field('content');
          this.field('excerpt');
          this.ref('url');

          data.forEach(function(doc) {
            this.add(doc);
            store[doc.url] = {
              title: doc.title,
              excerpt: doc.excerpt,
              url: doc.url
            };
          }, this);
        });

        // Enable search after index is built
        searchInput.disabled = false;
        searchInput.placeholder = 'Cari Nabi...';
      })
      .catch(error => {
        console.error('Error loading search index:', error);
        searchInput.placeholder = 'Search unavailable';
      });
  }

  // Perform search
  function search(term) {
    if (!index || !term || term.length < 2) {
      searchResults.style.display = 'none';
      searchClear.style.display = 'none';
      return;
    }

    var results = index.search(term + '*'); // Add wildcard for partial matches
    var resultsHtml = '';

    if (results.length > 0) {
      resultsHtml = '<div class="search-results-header">Hasil pencarian untuk "' + term + '":</div>';
      results.slice(0, 10).forEach(function(result) {
        var item = store[result.ref];
        if (item) {
          // Highlight search term in excerpt
          var highlightedExcerpt = item.excerpt.replace(
            new RegExp('(' + term + ')', 'gi'),
            '<mark>$1</mark>'
          );
          
          resultsHtml += '<div class="search-result-item">' +
                        '<h4><a href="' + item.url + '">' + item.title + '</a></h4>' +
                        '<p>' + highlightedExcerpt + '</p>' +
                        '</div>';
        }
      });
    } else {
      resultsHtml = '<div class="search-no-results">Tidak ada hasil untuk "' + term + '"</div>';
    }

    searchResults.innerHTML = resultsHtml;
    searchResults.style.display = 'block';
    searchClear.style.display = 'inline-block';
  }

  // Clear search
  function clearSearch() {
    searchInput.value = '';
    searchResults.style.display = 'none';
    searchClear.style.display = 'none';
    searchInput.focus();
  }

  // Event listeners
  searchInput.addEventListener('input', function() {
    searchTerm = this.value.trim();
    search(searchTerm);
  });

  searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      clearSearch();
    }
  });

  searchClear.addEventListener('click', clearSearch);

  // Click outside to close results
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.search-container')) {
      searchResults.style.display = 'none';
    }
  });

  // Initialize when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initSearch);
  } else {
    initSearch();
  }

  // Disable search input until index is loaded
  searchInput.disabled = true;
  searchInput.placeholder = 'Loading search...';
})();
</script>

<style>
.search-container {
  margin: 20px 0;
  position: relative;
  max-width: 600px;
}

.search-form {
  position: relative;
  display: flex;
  align-items: center;
}

#search-input {
  width: 100%;
  padding: 12px 40px 12px 16px;
  border: 2px solid #e1e4e8;
  border-radius: 6px;
  font-size: 16px;
  background-color: #ffffff;
  transition: border-color 0.2s ease;
}

#search-input:focus {
  outline: none;
  border-color: #0366d6;
  box-shadow: 0 0 0 3px rgba(3, 102, 214, 0.1);
}

#search-input:disabled {
  background-color: #f6f8fa;
  color: #6a737d;
}

.search-clear {
  position: absolute;
  right: 12px;
  background: none;
  border: none;
  font-size: 20px;
  color: #6a737d;
  cursor: pointer;
  padding: 0;
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.search-clear:hover {
  color: #24292e;
}

.search-results {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: #ffffff;
  border: 1px solid #e1e4e8;
  border-radius: 6px;
  box-shadow: 0 8px 24px rgba(149, 157, 165, 0.2);
  max-height: 400px;
  overflow-y: auto;
  z-index: 1000;
  margin-top: 4px;
}

.search-results-header {
  padding: 12px 16px;
  background-color: #f6f8fa;
  border-bottom: 1px solid #e1e4e8;
  font-weight: 600;
  font-size: 14px;
  color: #24292e;
}

.search-result-item {
  padding: 16px;
  border-bottom: 1px solid #e1e4e8;
  transition: background-color 0.2s ease;
}

.search-result-item:last-child {
  border-bottom: none;
}

.search-result-item:hover {
  background-color: #f6f8fa;
}

.search-result-item h4 {
  margin: 0 0 8px 0;
  font-size: 16px;
}

.search-result-item h4 a {
  color: #0366d6;
  text-decoration: none;
  font-weight: 600;
}

.search-result-item h4 a:hover {
  text-decoration: underline;
}

.search-result-item p {
  margin: 0;
  color: #586069;
  font-size: 14px;
  line-height: 1.4;
}

.search-no-results {
  padding: 24px 16px;
  text-align: center;
  color: #6a737d;
  font-style: italic;
}

mark {
  background-color: #fff3cd;
  padding: 1px 2px;
  border-radius: 2px;
}

/* Responsive design */
@media (max-width: 768px) {
  .search-container {
    margin: 16px 0;
  }
  
  #search-input {
    font-size: 16px; /* Prevent zoom on iOS */
  }
  
  .search-results {
    max-height: 300px;
  }
}
</style>
